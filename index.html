<title>寵物健康醫療網原型</title>
<style>
  :root{
    --accent:#00B2A9; --accent-dark:#00877F; --ink:#1a1a1a; --muted:#6a6a6a; --faint:#9a9a9a;
    --line:#e8e8e8; --surface:#f5f5f6; --bg:#ffffff; --pill:#f0f0f0; --pill-ink:#6a6a6a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#eef1f0;}
  #app{width:100%;background:var(--bg);}
  .wrap{width:100%;max-width:1440px;margin:0 auto;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);}
  a{color:var(--accent);text-decoration:none;}
  a:hover{color:var(--accent-dark);text-decoration:underline;}
  h1,h2,h3{text-wrap:balance;}
  .section{padding:40px 64px 0;}
  .section-title{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .section-title h2{font-size:20px;margin:0;white-space:nowrap;}
  .section-title .rule{flex:1;height:1px;background:var(--line);}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;}
  .card{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;background:#fff;}
  .card-img{background:var(--surface);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#b3b3b3;}
  .card-img.sq{aspect-ratio:1/1;}
  .card-img.feature{aspect-ratio:4/3;}
  .card-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .card-title{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{font-size:12px;color:var(--faint);}
  .tag{padding:6px 14px;border-radius:16px;font-size:12px;background:var(--pill);border:1px solid #e0e0e0;color:var(--pill-ink);display:inline-block;}
  .tag.clickable{cursor:pointer;}
  .tag.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:12px 32px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn-outline{border:1px solid #dcdcdc;background:#fff;border-radius:6px;padding:12px 32px;font-size:14px;color:#4a4a4a;cursor:pointer;}
  .input{border:1px solid #dcdcdc;border-radius:6px;padding:12px 14px;font-size:14px;font-family:inherit;width:100%;}
  select.input{cursor:pointer;}
  table.ref{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;}
  table.ref thead tr{background:var(--accent-dark);color:#fff;}
  table.ref th,table.ref td{padding:12px 16px;text-align:left;}
  table.ref tbody tr{border-top:1px solid #eee;}
  .table-wrap{border:1px solid #e5e5e5;border-radius:8px;overflow-x:auto;}
  .group-cell{background:#f7fbfb;font-weight:700;vertical-align:middle;white-space:nowrap;}
  table.ref td,table.ref th{white-space:nowrap;}
  .center-title{text-align:center;padding:48px 64px 0;}
  .center-title h1{font-size:32px;margin:0;}
  .breadcrumb{padding:24px 64px 0;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);flex-wrap:wrap;}
  .breadcrumb a{color:var(--faint);}
  .breadcrumb a:hover{color:var(--accent);}
  .breadcrumb .current{color:#4a4a4a;}
  .dropdown{position:relative;}
  .dropdown-menu{position:absolute;top:calc(100% + 18px);left:0;background:#fff;border:1px solid #eee;border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.12);min-width:172px;padding:8px 0;z-index:60;}
  .dropdown-item{padding:10px 20px;font-size:14px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;color:#4a4a4a;}
  .dropdown-item:hover{background:#f7fbfb;}
  .dropdown-item.active{color:var(--accent-dark);font-weight:600;}
  .nav-item{cursor:pointer;}
  .nav-item:hover{color:var(--accent);}
  .nav-item.disabled{color:#c7c7c7;cursor:default;}
  .nav-item.disabled:hover{color:#c7c7c7;}
  .header{width:100%;height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:100;}
  .header nav{display:flex;align-items:center;gap:26px;font-size:14px;}
  .header .brand{display:flex;align-items:center;gap:36px;}
  .header .brand img{height:34px;display:block;cursor:pointer;}
  .footer{padding:48px 64px 32px;border-top:1px solid #eee;}
  .footer-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;}
  .footer-col-title{font-size:14px;font-weight:700;margin-bottom:16px;}
  .footer-links{display:flex;flex-direction:column;gap:12px;}
  .footer-links a{color:#6a6a6a;font-size:13px;}
  .footer-bottom{margin-top:48px;padding-top:24px;border-top:1px solid #eee;font-size:12px;color:#9a9a9a;line-height:1.7;}
  .filter-box{border:1px solid #dcdcdc;border-radius:6px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:#fff;cursor:pointer;user-select:none;}
  .filter-box .label{color:#9a9a9a;margin-right:8px;}
  .pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px 0;}
  .pagination button{width:32px;height:32px;border-radius:6px;border:none;font-size:14px;cursor:pointer;background:none;color:#4a4a4a;}
  .pagination button.active{background:var(--accent);color:#fff;}
  .pagination .arrow{background:none;border:none;color:#9a9a9a;font-size:16px;cursor:pointer;}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:8px;}
  .dot{width:16px;height:4px;border-radius:2px;cursor:pointer;display:inline-block;background:#e0e0e0;}
  .dot.active{background:#1a1a1a;}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:6px;font-size:14px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;font-family:-apple-system,sans-serif;}
  .toast.show{opacity:1;}
  .video-promo{background:#b3181f;border-radius:12px;display:flex;align-items:center;overflow:hidden;color:#fff;}
  .video-promo .thumb{width:200px;height:200px;flex-shrink:0;background:#8a1218;display:flex;align-items:center;justify-content:center;}
  .video-promo .body{flex:1;padding:0 32px;}
  .video-promo .eyebrow{font-size:12px;background:rgba(255,255,255,.16);display:inline-flex;padding:4px 12px;border-radius:4px;margin-bottom:12px;}
  .video-promo .cta{margin:0 32px;background:#fff;color:#b3181f;font-size:13px;font-weight:700;padding:10px 20px;border-radius:6px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none;} }
</style>

function groupedTable(raw){
  var thead = '<tr><th style="width:100px;"></th><th>項目</th>'+CITY_LABELS.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
  var tbody = '', i = 0;
  while (i < raw.length) {
    var groupName = raw[i][0];
    var groupRows = [];
    while (i < raw.length && raw[i][0] === groupName) { groupRows.push(raw[i]); i++; }
    groupRows.forEach(function(row, idx){
      tbody += '<tr>';
      if (idx === 0) tbody += '<td class="group-cell" rowspan="'+groupRows.length+'">'+groupName+'</td>';
      tbody += '<td>'+row[1]+'</td>'+row.slice(2).map(function(v){return '<td>'+v+'</td>';}).join('')+'</tr>';
    });
  }
  return '<div class="table-wrap"><table class="ref"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
}

/* ---------- navigation / actions ---------- */
function goTo(page, params){
  state.headerMenu = null;
  state.page = page;
  if(params){
    if(page==='articleList' && params.petType){
      state.articleList.petType = params.petType;
      state.articleList.page = 1;
    }
    if(page==='drugDetail' && typeof params.index==='number'){ state.drugDetail.index = params.index; }
    if(page==='articleDetail'){ state.articleDetail.petType = params.petType || '狗狗健康'; }
    if(page==='searchResults'){
      state.searchResults.type = params.type || 'article';
      state.searchResults.keyword = params.keyword || '';
      state.searchResults.page = 1;
    }
  }
  if(page==='eventList'){
    state.eventList.category = (params && params.category) ? params.category : '活動好康';
    state.eventList.page = 1;
  }
  render();
  window.scrollTo(0,0);
}
function handleAction(action, arg){
  if(action==='toggleHeaderMenu'){ state.headerMenu = state.headerMenu===arg?null:arg; return; }
  if(action==='confirmExternal'){
    var parts = arg.split('|');
    state.headerMenu = null;
    state.externalModal = { url: parts[0], label: parts[1] };
    return;
  }
  if(action==='closeExternalModal'){ state.externalModal = null; return; }
  if(action==='confirmOpenExternal'){
    var target = state.externalModal;
    state.externalModal = null;
    if(target){ window.open(target.url, '_blank', 'noopener'); }
    return;
  }
  if(action==='stub'){ return; }
  if(action==='toggleClinicOpen'){ state.clinicList.open = state.clinicList.open===arg?null:arg; return; }
  if(action==='selectClinicFilter'){ var p=arg.split(':'); state.clinicList[p[0]]=p[1]; state.clinicList.open=null; return; }
  if(action==='setPage'){ var pg=arg.split(':'); setPath(pg[0], parseInt(pg[1],10)); return; }
  if(action==='searchArticle'){ var kw1=document.getElementById('articleSearchInput').value.trim(); goTo('searchResults', {type:'article', keyword:kw1}); return; }
  if(action==='searchDrug'){ var kw2=document.getElementById('drugSearchInput').value.trim(); goTo('searchResults', {type:'drug', keyword:kw2}); return; }
  if(action==='setEventPage'){ state.eventList.page=parseInt(arg,10); return; }
  if(action==='switchEventCategory'){ state.eventList.category=arg; state.eventList.page=1; return; }
  if(action==='setToc'){ state.articleDetail.toc=parseInt(arg,10); return; }
  if(action==='setImgDot'){ state.articleDetail.imgDot=parseInt(arg,10); return; }
  if(action==='setClinicPhoto'){ state.clinicDetail.photo=parseInt(arg,10); return; }
  if(action==='setDrugSearchArticleDot'){ state.drugSearch.articleDot=parseInt(arg,10); return; }
  if(action==='setDrugBannerDot'){ state.drugDetail.bannerDot=parseInt(arg,10); return; }
  if(action==='setDrugArticleDot'){ state.drugDetail.articleDot=parseInt(arg,10); return; }
  if(action==='prevDrug'){ var len=DRUGS.length; state.drugDetail.index=(state.drugDetail.index-1+len)%len; return; }
  if(action==='nextDrug'){ var len2=DRUGS.length; state.drugDetail.index=(state.drugDetail.index+1)%len2; return; }
  if(action==='setAuthorBannerDot'){ state.authorPage.bannerDot=parseInt(arg,10); return; }
  if(action==='calcSetPetType'){ state.ageCalc.petType=arg; state.ageCalc.showResult=false; return; }
  if(action==='calcIncAge'){ state.ageCalc.age=Math.min(30,state.ageCalc.age+1); state.ageCalc.showResult=false; return; }
  if(action==='calcDecAge'){ state.ageCalc.age=Math.max(1,state.ageCalc.age-1); state.ageCalc.showResult=false; return; }
  if(action==='calcCompute'){
    var c=state.ageCalc, human;
    if(c.petType==='狗'){ human = c.age<=1 ? Math.round(c.age*12.5) : Math.round(14*Math.log(c.age)+31); }
    else { human = c.age<=2 ? Math.round(c.age*12.5) : Math.round(25+(c.age-2)*4); }
    c.showResult=true; c.result=Math.max(human,1);
    return;
  }
}

function renderExternalModal(){
  var m = state.externalModal;
  return '<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;">'+
    '<div style="background:#fff;border-radius:10px;padding:32px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2);">'+
      '<div style="font-size:16px;font-weight:700;margin-bottom:12px;">即將前往外部網站</div>'+
      '<div style="font-size:14px;color:#6a6a6a;line-height:1.7;margin-bottom:10px;">您即將離開寵物健康醫療網，前往「'+m.label+'」外部網站：</div>'+
      '<div style="font-size:13px;color:#00A79D;word-break:break-all;margin-bottom:24px;">'+m.url+'</div>'+
      '<div style="display:flex;gap:12px;">'+
        '<button class="btn-outline" style="flex:1;" data-action="closeExternalModal">取消</button>'+
        '<button class="btn-primary" style="flex:1;" data-action="confirmOpenExternal">繼續前往</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function render(){
  var fn = PAGES[state.page] || PAGES.home;
  var modalHtml = state.externalModal ? renderExternalModal() : '';
  document.getElementById('app').innerHTML = '<div class="wrap">'+renderHeader()+fn()+renderFooter()+'</div>'+modalHtml;
}

document.getElementById('app').addEventListener('click', function(e){
  var act = e.target.closest('[data-action]');
  if(act){ e.preventDefault(); handleAction(act.dataset.action, act.dataset.arg); render(); return; }
  var nav = e.target.closest('[data-nav]');
  if(nav){ e.preventDefault(); var params = nav.dataset.params ? JSON.parse(nav.dataset.params) : null; goTo(nav.dataset.nav, params); return; }
});
document.getElementById('app').addEventListener('change', function(e){
  var el = e.target.closest('[data-onchange]');
  if(el){ handleAction(el.dataset.onchange, e.target.value); render(); }
});
render();

})();
</script>
