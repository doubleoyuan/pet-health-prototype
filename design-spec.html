<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寵物健康醫療網 2.0 — 設計交付規格書</title>
<style>
  :root{
    --primary:#1E3A36; --primary-ink:#152a26; --accent:#16A39A; --accent-dark:#0F7D76;
    --ink:#1a1f1e; --muted:#5c6765; --faint:#8a9492; --line:#e3e9e7;
    --bg:#ffffff; --surface:#f5f8f7; --sidebar-bg:#f2f6f5;
    --tag-design-bg:#e3f6f4; --tag-design-ink:#0f7d76;
    --tag-eng-bg:#e6ece9; --tag-eng-ink:#1E3A36;
    --tag-todo-bg:#fff2dc; --tag-todo-ink:#8a5a00;
    --tag-note-bg:#eef1f5; --tag-note-ink:#44525e;
    --tag-data-bg:#f2f2ef; --tag-data-ink:#55554d;
    --tag-nav-ink:#16A39A;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--surface);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.75;}
  a{color:var(--accent-dark);}
  a:hover{color:var(--primary);}

  .topbar{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .topbar .titles{display:flex;flex-direction:column;gap:2px;}
  .topbar .titles .proj{font-size:12.5px;letter-spacing:.06em;color:#bcd4d0;text-transform:uppercase;}
  .topbar .titles .doc{font-size:17px;font-weight:700;}
  .topbar .proto-link{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;padding:9px 18px;border-radius:7px;font-size:13.5px;font-weight:700;white-space:nowrap;text-decoration:none;}
  .topbar .proto-link:hover{background:var(--accent-dark);color:#fff;}
  .topbar .menu-btn{display:none;background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:7px;font-size:18px;cursor:pointer;}

  .layout{display:flex;max-width:1280px;margin:0 auto;align-items:flex-start;}

  .sidebar{flex:0 0 250px;position:sticky;top:68px;align-self:flex-start;max-height:calc(100vh - 68px);overflow-y:auto;padding:28px 18px 40px 28px;}
  .sidebar nav a{display:block;padding:6px 10px;border-radius:6px;font-size:13.5px;color:var(--muted);text-decoration:none;border-left:2px solid transparent;}
  .sidebar nav a.lvl3{padding-left:22px;font-size:13px;}
  .sidebar nav a.lvl4{padding-left:34px;font-size:12.5px;color:var(--faint);}
  .sidebar nav a:hover{background:var(--sidebar-bg);color:var(--primary);}
  .sidebar nav a.active{background:var(--tag-design-bg);color:var(--accent-dark);border-left-color:var(--accent);font-weight:600;}

  main{flex:1;min-width:0;padding:36px 40px 100px;max-width:800px;}

  #content h1{display:none;}
  #content h2{font-size:22px;margin:48px 0 18px;color:var(--primary);border-bottom:2px solid var(--line);padding-bottom:10px;scroll-margin-top:84px;}
  #content h2:first-child{margin-top:0;}
  #content h3{font-size:18px;margin:36px 0 14px;color:var(--primary);scroll-margin-top:84px;}
  #content h4{font-size:15.5px;margin:30px 0 12px;color:var(--accent-dark);scroll-margin-top:84px;}
  #content p{margin:0 0 14px;font-size:14.5px;color:#2b322f;}
  #content ul{margin:0 0 14px;padding-left:22px;font-size:14.5px;}
  #content li{margin-bottom:6px;}
  #content blockquote{margin:0 0 20px;padding:14px 18px;background:var(--tag-design-bg);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--accent-dark);}
  #content blockquote p{margin:0;color:inherit;}
  #content code{background:#eef2f1;color:var(--primary);padding:1px 6px;border-radius:4px;font-size:.92em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  #content hr{border:none;border-top:1px solid var(--line);margin:40px 0;}
  #content em{color:var(--faint);}
  #content table{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 20px;}
  #content th{background:var(--primary);color:#fff;text-align:left;padding:10px 14px;}
  #content td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
  #content tr:nth-child(even) td{background:var(--surface);}

  .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:999px;letter-spacing:.01em;margin-bottom:6px;}
  .tag-design{background:var(--tag-design-bg);color:var(--tag-design-ink);}
  .tag-eng{background:var(--tag-eng-bg);color:var(--tag-eng-ink);}
  .tag-todo{background:var(--tag-todo-bg);color:var(--tag-todo-ink);}
  .tag-note{background:var(--tag-note-bg);color:var(--tag-note-ink);}
  .tag-data{background:var(--tag-data-bg);color:var(--tag-data-ink);}
  .tag-fixed{background:var(--tag-eng-bg);color:var(--tag-eng-ink);}
  .tag-nav{background:transparent;color:var(--tag-nav-ink);padding:3px 0;}
  .tag + br{display:none;}
  #content p:has(> .tag:first-child){background:#fafcfb;border:1px solid var(--line);border-radius:8px;padding:14px 16px 12px;}
  #content p:has(> .tag-nav:first-child){background:transparent;border:none;padding:0;font-size:13.5px;color:var(--muted);}

  .page-footer{max-width:800px;margin:0 auto;padding:0 40px 80px;color:var(--faint);font-size:12.5px;}

  @media (max-width: 900px){
    .layout{display:block;}
    .topbar .menu-btn{display:block;}
    .sidebar{position:fixed;top:68px;left:0;right:0;bottom:0;background:var(--bg);z-index:40;display:none;max-height:none;padding:20px;}
    .sidebar.open{display:block;}
    main{padding:28px 20px 80px;max-width:100%;}
    .page-footer{padding:0 20px 60px;}
  }

  @media print{
    .topbar, .sidebar{display:none;}
    main{max-width:100%;padding:0;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="titles">
    <span class="proj">寵物健康醫療網 2.0</span>
    <span class="doc">設計交付規格書</span>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="開啟目錄">☰</button>
  <a class="proto-link" href="https://doubleoyuan.github.io/pet-health-prototype/" target="_blank" rel="noopener">查看可互動原型 ↗</a>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav id="tocNav"></nav>
  </aside>
  <main>
    <div id="content"></div>
  </main>
</div>

<div class="page-footer">最後更新：2026-10-01</div>

function b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const md = b64ToUtf8(SPEC_MD_B64);
marked.setOptions({ gfm:true, breaks:false });
let html = marked.parse(md);

const tagReplacements = [
  [/<strong>(設計需要做的事)<\/strong>：/g, '<span class="tag tag-design">$1</span>'],
  [/<strong>(工程／邏輯需要做的事[^<]*)<\/strong>：/g, '<span class="tag tag-eng">$1</span>'],
  [/<strong>(待PO確認[^<]*)<\/strong>：/g, '<span class="tag tag-todo">$1</span>'],
  [/<strong>(特別提醒)<\/strong>：/g, '<span class="tag tag-note">$1</span>'],
  [/<strong>(主要資料)<\/strong>：/g, '<span class="tag tag-data">$1</span>'],
  [/<strong>(固定的選單內容[^<]*)<\/strong>：/g, '<span class="tag tag-fixed">$1</span>'],
  [/<strong>(怎麼點進去)<\/strong>：/g, '<span class="tag tag-nav">$1</span>'],
];
tagReplacements.forEach(([re, rep]) => { html = html.replace(re, rep); });

document.getElementById('content').innerHTML = html;

// Build sidebar TOC from rendered headings (skip the hidden h1)
const content = document.getElementById('content');
const headings = Array.from(content.querySelectorAll('h2, h3, h4'));
const tocNav = document.getElementById('tocNav');
headings.forEach((h, i) => {
  const id = 'sec-' + i;
  h.id = id;
  const a = document.createElement('a');
  a.href = '#' + id;
  a.textContent = h.textContent;
  a.className = 'lvl' + h.tagName.slice(1);
  tocNav.appendChild(a);
});

// Highlight active section on scroll
const tocLinks = Array.from(tocNav.querySelectorAll('a'));
function onScroll(){
  let activeIdx = 0;
  headings.forEach((h, i) => { if (h.getBoundingClientRect().top - 90 <= 0) activeIdx = i; });
  tocLinks.forEach((a, i) => a.classList.toggle('active', i === activeIdx));
}
window.addEventListener('scroll', onScroll, { passive:true });
onScroll();

// Mobile menu toggle
const sidebar = document.getElementById('sidebar');
document.getElementById('menuBtn').addEventListener('click', () => {
  sidebar.classList.toggle('open');
});
tocNav.addEventListener('click', (e) => {
  if (e.target.tagName === 'A') sidebar.classList.remove('open');
});
</script>

</html>
